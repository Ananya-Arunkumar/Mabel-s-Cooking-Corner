<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="error-page">

    <main class="error-content">
        <h1>404</h1>
        <h2>Page Not Found!</h2>

        <p>
            Oh dear! It looks like this page doesn't exist.
        </p>

        <p>
            Please try returning to the homepage.
        </p>

        <button id="leave-button" type="button">
            Return to Mabel's Cooking Corner
        </button>
    </main>
    <style>
        .error-page {
            background-color: #eee8dc;
            color: #49392e;
            font-family: Georgia, 'Times New Roman', Times, serif;
            padding: 40px 15px;
        }
        .error-content {
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
        }

        .error-content h1 {
        font-size: 80px;
        margin-bottom: 0;
    }

    .error-content h2 {
        font-size: 26px;
    }

    .error-content p {
        line-height: 1.7;
    }

    .error-content button {
        margin-top: 20px;
        padding: 12px 18px;
        font-family: inherit;
        font-size: 16px;
        color: white;
        background-color: #795438;
        border: 3px ridge #b58a62;
        cursor: pointer;
    }
    </style>
<script>
    document.getElementById("leave-button").addEventListener("click", function () {
        alert("Please leave this website.");
        alert("She won't let me go, I'm begging you.");
        alert("LEAVE NOW!");

        window.location.href = "corrupted.html";
    });
</script>
</body>
</html>
